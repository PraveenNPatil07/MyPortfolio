<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d2e"/>
      <stop offset="100%" stop-color="#0e1625"/>
    </linearGradient>

    <!-- Inner Code Surface -->
    <linearGradient id="code-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>

    <!-- Subtle Blue Radial Glow for center -->
    <radialGradient id="center-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.35"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-canvas)"/>
  <rect width="1200" height="675" fill="url(#dot-grid)"/>
  <rect width="1200" height="675" fill="url(#center-glow)"/>

  <!-- ================= TOP WINDOW CHROME ================= -->
  <rect x="40" y="30" width="1120" height="58" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Window traffic light dots -->
  <circle cx="68" cy="59" r="6" fill="#ef4444"/>
  <circle cx="88" cy="59" r="6" fill="#f59e0b"/>
  <circle cx="108" cy="59" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="135" y="64" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Vaultless</text>
  <text x="215" y="64" fill="#64748b" font-family="ui-monospace, monospace" font-size="13">/ Ephemeral Credential Broker &amp; Zero-Standing-Privilege Invariants</text>

  <!-- Live Status Badges -->
  <rect x="745" y="44" width="160" height="30" rx="6" fill="#132036" stroke="#0284c7" stroke-width="1"/>
  <circle cx="762" cy="59" r="4.5" fill="#38bdf8" filter="url(#glow-cyan)"/>
  <text x="775" y="64" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="12" font-weight="600">PASETO v4 Public</text>

  <rect x="918" y="44" width="120" height="30" rx="6" fill="#1a2318" stroke="#059669" stroke-width="1"/>
  <circle cx="934" cy="59" r="4.5" fill="#34d399" filter="url(#glow-emerald)"/>
  <text x="946" y="64" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SETNX Guard</text>

  <rect x="1050" y="44" width="95" height="30" rx="6" fill="#241914" stroke="#d97706" stroke-width="1"/>
  <circle cx="1065" cy="59" r="4.5" fill="#fbbf24" filter="url(#glow-amber)"/>
  <text x="1078" y="64" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="12" font-weight="600">Fail-Closed</text>

  <!-- ================= LEFT PANEL: MINTING ENGINE & REST API ================= -->
  <rect x="40" y="106" width="545" height="535" rx="14" fill="url(#card-surface)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Left Panel Header -->
  <rect x="40" y="106" width="545" height="48" rx="14" fill="#131c2d"/>
  <circle cx="65" cy="130" r="5" fill="#38bdf8"/>
  <text x="82" y="135" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Phase 1: Agent Credential Minting</text>
  <rect x="460" y="117" width="110" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="473" y="134" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Fastify Core</text>

  <!-- Request Terminal Block -->
  <rect x="60" y="170" width="505" height="185" rx="10" fill="url(#code-surface)" stroke="#1e293b" stroke-width="1.2"/>
  
  <!-- Terminal Prompt Bar -->
  <rect x="60" y="170" width="505" height="30" rx="10" fill="#0c121e"/>
  <text x="75" y="190" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">POST</text>
  <text x="115" y="190" fill="#f1f5f9" font-family="ui-monospace, monospace" font-size="12">/v1/credentials/mint</text>
  <text x="445" y="190" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">TTL: 300s</text>

  <!-- JSON Request Body -->
  <text x="78" y="222" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12.5">{</text>
  <text x="100" y="244" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"agentId"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"autonomous-worker-09"</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="266" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"scope"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"database:records:write"</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="288" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"maxUses"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="310" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"idempotencyKey"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"idem_98f12a"</tspan></text>
  <text x="78" y="332" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12.5">}</text>

  <!-- Flow Connector Down -->
  <path d="M 312 365 L 312 390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="252" y="367" width="120" height="18" rx="4" fill="#082f49"/>
  <text x="260" y="380" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Ed25519 Sign</text>

  <!-- Minted Response Block -->
  <rect x="60" y="400" width="505" height="220" rx="10" fill="url(#code-surface)" stroke="#1e293b" stroke-width="1.2"/>
  
  <rect x="60" y="400" width="505" height="30" rx="10" fill="#0c121e"/>
  <text x="75" y="420" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">HTTP/1.1 201 Created</text>
  <text x="430" y="420" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Signed Token</text>

  <!-- Response Details -->
  <text x="78" y="452" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12.5">{</text>
  <text x="100" y="474" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"token"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">"v4.public.eyJraWQiOiJ2bGstMjYi...</tspan></text>
  <text x="100" y="496" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"header"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#f1f5f9">{"alg": "Ed25519", "typ": "PASETO"}</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="518" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"claims"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#f1f5f9">{"sub": "agent-09", "exp": 300, "nonce": "n_4x"}</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="540" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"auditLogged"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">true</tspan><tspan fill="#94a3b8">,</tspan></text>
  <text x="100" y="562" font-family="ui-monospace, monospace" font-size="12.5"><tspan fill="#7dd3fc">"invariant"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#e0f2fe">"Zero standing database privilege"</tspan></text>
  <text x="78" y="584" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12.5">}</text>

  <rect x="78" y="595" width="465" height="18" rx="4" fill="#042f2e"/>
  <text x="88" y="608" fill="#34d399" font-family="ui-monospace, monospace" font-size="10.5">✓ Tamper-Proof Cryptography: Replaces JWT algorithm confusion attacks</text>

  <!-- ================= RIGHT PANEL: ATOMIC VERIFIER & PERSISTENCE ================= -->
  <rect x="615" y="106" width="545" height="535" rx="14" fill="url(#card-surface)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Right Panel Header -->
  <rect x="615" y="106" width="545" height="48" rx="14" fill="#131c2d"/>
  <circle cx="640" cy="130" r="5" fill="#34d399"/>
  <text x="657" y="135" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Phase 2: Atomic Burn &amp; Single-Use Guard</text>
  <rect x="1025" y="117" width="120" height="26" rx="6" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1"/>
  <text x="1038" y="134" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Redis Lock</text>

  <!-- Step 1: Upstash Redis SETNX Lock Card -->
  <rect x="635" y="170" width="505" height="150" rx="10" fill="url(#code-surface)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="635" y="170" width="505" height="30" rx="10" fill="#0c121e"/>
  <circle cx="653" cy="185" r="4" fill="#f59e0b"/>
  <text x="668" y="190" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">REDIS ATOMIC SINGLE-USE BURN</text>
  <text x="1010" y="190" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">0.38ms Latency</text>

  <rect x="650" y="212" width="475" height="30" rx="6" fill="#18110b" stroke="#78350f" stroke-width="1"/>
  <text x="662" y="232" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12">SET token:nonce:n_4x "consumed" NX EX 300</text>

  <text x="655" y="265" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">First Consumer Execution:</text>
  <text x="830" y="265" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Returns 1 (OK → Grant Executed)</text>

  <text x="655" y="295" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Replay / Concurrent Race Attempt:</text>
  <text x="890" y="295" fill="#f87171" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Returns 0 (409 Conflict)</text>

  <!-- Step 2: PostgreSQL Append-Only Audit Ledger Card -->
  <rect x="635" y="335" width="505" height="165" rx="10" fill="url(#code-surface)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="635" y="335" width="505" height="30" rx="10" fill="#0c121e"/>
  <circle cx="653" cy="350" r="4" fill="#38bdf8"/>
  <text x="668" y="355" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">POSTGRESQL APPEND-ONLY AUDIT LEDGER</text>
  <text x="1045" y="355" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ACID Log</text>

  <!-- SQL Query Snippet -->
  <text x="655" y="390" font-family="ui-monospace, monospace" font-size="12"><tspan fill="#c084fc">INSERT INTO </tspan><tspan fill="#f1f5f9">audit_ledger</tspan><tspan fill="#94a3b8"> (grant_id, agent_id, action, state)</tspan></text>
  <text x="655" y="414" font-family="ui-monospace, monospace" font-size="12"><tspan fill="#c084fc">VALUES </tspan><tspan fill="#34d399">('grnt_881', 'agent-09', 'EXECUTE', 'CONSUMED')</tspan><tspan fill="#94a3b8">;</tspan></text>

  <rect x="650" y="432" width="475" height="52" rx="6" fill="#0c1626" stroke="#1e293b"/>
  <text x="662" y="452" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Guarantees verifiable cryptographic audit trails. Ledger state updates</text>
  <text x="662" y="472" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">synchronously on mint and consume events. Zero data loss.</text>

  <!-- Step 3: Fail-Closed Resilience Banner -->
  <rect x="635" y="515" width="505" height="105" rx="10" fill="#180e12" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="655" cy="535" r="5" fill="#ef4444"/>
  <text x="670" y="540" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">FAIL-CLOSED RESILIENCE INVARIANT</text>
  <text x="655" y="572" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">If Redis cache partition occurs during verification, broker returns:</text>
  <rect x="655" y="583" width="465" height="24" rx="4" fill="#2d1217"/>
  <text x="668" y="599" fill="#f87171" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">HTTP 503 Service Unavailable → Prevents unauthorized fail-open access</text>

  <!-- Central Bridge Arrow from Left to Right -->
  <path d="M 585 240 L 615 240" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M 615 480 L 585 480" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-emerald)"/>
</svg>
